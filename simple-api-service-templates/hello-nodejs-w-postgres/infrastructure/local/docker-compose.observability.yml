---
networks:
  api-service-network:

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: ${COMPOSE_PROJECT_NAME}_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api-service
    restart: always
    networks:
      - api-service-network

  loki:
    image: grafana/loki:3.4.2
    container_name: ${COMPOSE_PROJECT_NAME}_loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ../../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: always
    networks:
      - api-service-network

  promtail:
    image: grafana/promtail:3.4.2
    container_name: ${COMPOSE_PROJECT_NAME}_promtail
    user: root
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../../observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: always
    networks:
      - api-service-network

  grafana:
    image: grafana/grafana:11.5.2
    container_name: ${COMPOSE_PROJECT_NAME}_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: always
    networks:
      - api-service-network
